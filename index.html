<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="classes.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="parser.js"></script>
</head>

<body>
    <svg id="svg" width="100%" height="100%"></svg>
    <div id="tooltip-container"></div>
    
    <!-- tooltips definition -->
    <tooltips>
        <error3>Database info dwqd qdqwdqdq dqw dqw dqwwdqwd qwd qwd qwdqwwqdw qd qwd qwd qd q dq two</error3>
        <filter>Database info</filter>
        <dosmth>TUS MUERTOS EN SALCHIPAPA</dosmth>
    </tooltips>

    <!-- flowchart definition -->
    <step id="batch" next="fetch">BATCH TRIGGER</step>
    <step id="fetch">DATABASE FETCH</step>
    <db id="filter" next="fetch">FILTER OPERATION</db>
    <step id="accounts" next="kafka">ACCOUNTS DEFINITIONS</step>
    <step id="kafka" next="if">GENERATE EVENT</step>
    <if id="if" next="dosmth" fork="calc,bottom;error,right">CONDITION 1</if>
    <group>
        <if id="calc" >CONDITION 2</if>
        <if id="error">SEND ERROR</if>
    </group>
    <if id="dosmth">DO SOMETHING</if>
    <group>
        <api id="error2">SEND ERROR2</api>
        <kafka id="error3">SEND ERROR3</kafka>
        <db id="error4">SEND ERROR4</db>
    </group>
    <step id="end">END</step>
</body>

</html>
